name: actions-runner

services:
  runner:
    build:
      context: .
    image: suite-runner
    container_name: suite-runner
    hostname: suite-runner
    restart: unless-stopped
    env_file: .env
    volumes:
      - gradle:/home/runner/.gradle
      - work:/home/runner/actions-runner/_work
      - sdk:/opt/android-sdk

volumes:
  gradle:
  work:
  sdk:
